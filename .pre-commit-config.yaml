# The mypy hook below is `language: system` and needs the project's dev
# environment on PATH. pre-commit.ci's sandbox has no such environment, so the
# hook aborts there with "Executable `mypy` not found" and fails the required
# `pre-commit.ci - pr` check on every PR. Type checking is not lost: the hosted
# CI `lint` job and `make lint` both run the same mypy invocation.
ci:
  skip: [mypy]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=4096']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Runs the project's own pinned mypy (requirements-dev.txt via `make dev`)
  # against the same app/ evals/ scope as `make lint` and hosted CI (AUG-064),
  # instead of mirrors-mypy's isolated environment with its own floating
  # dependency set.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (canonical dev environment)
        entry: mypy app/ evals/ --ignore-missing-imports
        language: system
        pass_filenames: false
        types: [python]
