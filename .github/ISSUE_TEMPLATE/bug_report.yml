name: Bug Report
description: Report a bug in Topic Watch
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the fields below as completely as possible.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I'm on the latest release and have searched existing issues and discussions.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
      placeholder: |
        What I did: ...
        What happened: ...
        What I expected: ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error ...
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: How are you running Topic Watch?
      options:
        - Docker
        - Docker Compose
        - Local (pip install)
        - Source checkout
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: App version or commit hash (UI footer, or `python -m app.cli --version`). Please update to the latest release first to check it's not already fixed.
      placeholder: "e.g. 1.2.2 or b325d7a"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **This issue is public.** Before pasting diagnostics or logs below, remove
        or redact: feed/article URLs and their contents, notification webhook URLs,
        your API key, local file paths, and anything else about the topics you
        monitor that you don't want publicly visible. Found something that looks
        like a real credential leak rather than a bug? Don't post it here — see
        [SECURITY.md](../../SECURITY.md) instead.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Paste the output of `python -m app.cli doctor`
        (Docker: `docker compose exec topic-watch python -m app.cli doctor`).
        It redacts the API key (set/not set) and notification URLs (scheme + count
        only), but feed hosts and short path segments are still shown — check the
        output against the warning above before posting. If you can't run it, note
        your OS, Python version, and how you installed Topic Watch.
      render: shell
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Paste any relevant log lines here. Use `docker compose logs` or check your
        terminal output. Logs are not redacted — check them against the warning
        above first.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context, screenshots, or information that might help.
    validations:
      required: false
