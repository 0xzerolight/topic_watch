name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt && pip install --no-deps -e .

      - name: Verify installed dependency metadata is consistent
        run: pip check

      - name: Verify runtime lock is a subset of the dev lock (AUG-303)
        run: make verify-locks

      - name: Ruff lint check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy app/ evals/ --ignore-missing-imports

      - name: Verify evals harness imports
        run: python -c "import evals"

  test:
    runs-on: ubuntu-latest
    needs: lint
    # Liveness bound (TW-AUD-034): a hang must fail loud, not run out the clock
    # silently. ~4-5min observed full-suite wall time; this leaves headroom.
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt && pip install --no-deps -e .

      - name: Run tests
        id: pytest
        run: pytest --tb=short --junitxml=pytest-results.xml --cov-report=xml:coverage.xml | tee pytest-output.log
        env:
          TOPIC_WATCH_LLM__MODEL: "openai/gpt-4o-mini"
          TOPIC_WATCH_LLM__API_KEY: "test-key-not-real"

      - name: Write test receipt (TW-AUD-034)
        if: always()
        run: |
          {
            echo "commit: ${{ github.sha }}"
            echo "python: ${{ matrix.python-version }}"
            echo "command: pytest --tb=short --junitxml=pytest-results.xml --cov-report=xml:coverage.xml"
            echo "coverage_gate: --cov-fail-under=85 (pyproject.toml addopts)"
            echo "step_outcome: ${{ steps.pytest.outcome }}"
            date -u +"finished_at_utc: %Y-%m-%dT%H:%M:%SZ"
          } > test-receipt.txt
          cat test-receipt.txt

      - name: Upload test result artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            pytest-results.xml
            coverage.xml
            pytest-output.log
            test-receipt.txt
          retention-days: 30

  docker:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t topic-watch:ci .

  security:
    # Dependency vulnerability scan (OVH-062, AUG-062). Hash-locked pins protect
    # install integrity but pin a vulnerable version as firmly as a safe one —
    # this is the gate that flags newly-disclosed CVEs in the
    # litellm/lxml/trafilatura tree that parses untrusted feed content. The
    # baseline was clean at promotion time (2026-08-20), so this job now blocks.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime dependencies for known advisories
        # Escape hatch for an advisory that is confirmed unfixable at the current
        # pin (no patched release, or a patch that breaks the hash-locked graph):
        # add its GHSA/CVE/PYSEC id here with a comment explaining why, and when
        # to revisit. Empty by default — every entry here is a deliberate,
        # documented exception to the blocking gate above, not a default.
        env:
          PIP_AUDIT_IGNORE_VULNS: ""
        run: |
          set -euo pipefail
          ignore_args=()
          for vuln_id in $PIP_AUDIT_IGNORE_VULNS; do
            ignore_args+=(--ignore-vuln "$vuln_id")
          done
          pip-audit --requirement requirements.txt "${ignore_args[@]}"
